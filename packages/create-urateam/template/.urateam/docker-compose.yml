services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - agent
    networks:
      - frontend

  agent:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Compose interpolates ${POSTGRES_PASSWORD} from .env here. It does NOT
      # interpolate inside .env itself, so DATABASE_URL must be assembled
      # at the compose layer rather than the env-file layer.
      DATABASE_URL: "postgres://urateam:${POSTGRES_PASSWORD}@postgres:5432/urateam"
    depends_on:
      - postgres
    expose:
      - "3000"
      - "3001"
    volumes:
      - agent-runs:/var/agent-runs
      - agent-repos:/var/agent-repos
    networks:
      - frontend
      - backend

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: urateam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: urateam
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend

networks:
  frontend:
  backend:

volumes:
  pgdata:
  agent-runs:
  agent-repos:
  caddy-data:
  caddy-config:
