name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # npm trusted publishing (OIDC) requires npm >= 11.5.1.
      # Node 22 ships with npm 10.x. Use npx to fetch a modern npm on demand
      # instead of a global self-upgrade (`npm install -g npm@latest` leaves
      # the bundled install in a broken state where it can't find its own
      # transitive deps like promise-retry).
      #
      # pnpm pack resolves workspace:* to real versions in the tarball.
      #
      # The `publish-package` helper script skips "version already exists"
      # errors so per-package version bumps are supported (the workflow
      # publishes all 4 packages on each tag, but some may already be at
      # the same version).
      # Each package is packed → verified → published. The verify step
      # extracts the tarball and asserts expected files are present (and
      # for create-urateam, runs scaffold() end-to-end). Verification
      # failure blocks the subsequent publish, preventing broken artifacts
      # from reaching npm — the safety net the 0.1.4 ENOENT crash needed.
      - name: Pack, verify, and publish @urateam/core
        run: |
          cd packages/core
          pnpm pack
          ../../.github/scripts/verify-tarball.sh "$(ls *.tgz)" @urateam/core
          ../../.github/scripts/publish-package.sh *.tgz

      - name: Pack, verify, and publish @urateam/dashboard
        run: |
          cd packages/dashboard
          pnpm pack
          ../../.github/scripts/verify-tarball.sh "$(ls *.tgz)" @urateam/dashboard
          ../../.github/scripts/publish-package.sh *.tgz

      - name: Pack, verify, and publish @urateam/cli
        run: |
          cd packages/cli
          pnpm pack
          ../../.github/scripts/verify-tarball.sh "$(ls *.tgz)" @urateam/cli
          ../../.github/scripts/publish-package.sh *.tgz

      - name: Pack, verify, and publish create-urateam
        run: |
          cd packages/create-urateam
          pnpm pack
          ../../.github/scripts/verify-tarball.sh "$(ls *.tgz)" create-urateam
          ../../.github/scripts/publish-package.sh *.tgz
